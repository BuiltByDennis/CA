name: Build CA APK

# Builds an installable Android APK and stores it as a downloadable
# artifact. MANUAL ONLY (since 2026-10-15): pushing code no longer
# triggers a build, so the free Actions minutes are spent only when a
# new APK is actually wanted.
#
# To build: GitHub → CA repo → Actions → "Build CA APK" → Run workflow
# → Run workflow. The APK appears under that run's Artifacts.
on:
  workflow_dispatch: {}

# Pressing Run twice never burns double minutes: the older run cancels.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the database code
        # lib/core/db/app_db.g.dart is gitignored (too large for the push
        # channel) and MUST be regenerated before anything compiles.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Write Supabase config (only if repo secrets are set)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf '{ "SUPABASE_URL": "%s", "SUPABASE_ANON_KEY": "%s" }' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > dart_defines.json
            echo "Supabase config found — building a connected APK."
          else
            echo "No SUPABASE_URL / SUPABASE_ANON_KEY secrets — building an offline-only APK."
          fi

      - name: Build release APK
        run: |
          if [ -f dart_defines.json ]; then
            flutter build apk --release --dart-define-from-file=dart_defines.json
          else
            flutter build apk --release
          fi

      - name: Upload the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
